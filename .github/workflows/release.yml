name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package tooling and tests
        run: python -m pip install jsonschema pytest
      - name: Run tests
        run: pytest -q
      - name: Build PCM package
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/build_pcm_package.py --version "$version"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/cubemx-kicad-netlabels-*.zip \
            dist/metadata.submit.json \
            --generate-notes
